<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Ancient Coin - NFT</title>
<style>
  body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .coin-img { width: 100%; height: auto; border-radius: 8px; border: 2px solid #333; }
  h1 { font-size: 22px; color: #d4af37; margin-top: 15px; }
  .badge { display: inline-block; background: #333; color: #d4af37; padding: 5px 10px; border-radius: 5px; font-size: 12px; margin-bottom: 10px; }
  .section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #333; }
  .section h3 { font-size: 16px; color: #fff; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.6; color: #b0b0b0; }
  .puzzle-box { background: #2a251a; border: 1px dashed #d4af37; padding: 12px; border-radius: 8px; margin-top: 20px; }
  .btn-opensea { display: block; text-align: center; background: #2081e2; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 20px; }
  .btn-share { display: block; text-align: center; background: #333; color: #e0e0e0; text-decoration: none; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
  .back { display: inline-block; color: #d4af37; text-decoration: none; font-size: 13px; margin-bottom: 12px; }
  .error { color: #ff6b6b; text-align: center; font-size: 18px; margin-top: 50px; }
</style>
</head>
<body>

<div class="container" id="content-box">
  <div style="text-align:center; padding:40px;">Loading...</div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var coinId = params.get("id");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function row(label, value) {
    return value ? "<p><strong>" + label + ":</strong> " + esc(value) + "</p>" : "";
  }

  function section(title, body) {
    return body ? '<div class="section"><h3>' + title + "</h3>" + body + "</div>" : "";
  }

  async function loadCoin() {
    var box = document.getElementById("content-box");

    if (!coinId) {
      box.innerHTML = '<div class="error">No coin ID provided.</div>';
      return;
    }

    try {
      var res = await fetch("../data/coins.json?v=" + Date.now());
      var data = await res.json();
      var coin = data[coinId];

      if (!coin) {
        box.innerHTML = '<div class="error">This coin was not found.</div>';
        return;
      }

      var img = /^(https?:)?\/\//.test(coin.image_url) ? coin.image_url : "../" + coin.image_url;

      var details = row("Ruler", coin.ruler) + row("Approximate date", coin.date) + row("Details", coin.specifications);

      var html = '<a class="back" href="../">&larr; Back to gallery</a><br>' +
        '<span class="badge">' + esc(coin.dynasty) + " - ID: " + esc(coin.id) + "</span>" +
        "<h1>" + esc(coin.title) + "</h1>" +
        '<img src="' + esc(img) + '" alt="' + esc(coin.title) + '" class="coin-img">' +
        section("Specifications", details) +
        section("Historical Notes", coin.historical_description ? "<p>" + esc(coin.historical_description) + "</p>" : "") +
        section("The Story", coin.story ? "<p>" + esc(coin.story) + "</p>" : "");

      if (coin.puzzle_group) {
        html += '<div class="puzzle-box"><h3>Collector Puzzle</h3>' +
          "<p><strong>Puzzle group:</strong> " + esc(coin.puzzle_group) + "</p>" +
          "<p><strong>Piece number:</strong> " + esc(coin.puzzle_part) + " of 3</p>" +
          '<p><strong>Secret fragment:</strong> <span style="color:#d4af37; font-weight:bold; font-size:16px;">' + esc(coin.puzzle_text) + "</span></p>" +
          '<p style="font-size:12px; color:#888;">Find the other coins in this set to complete the secret word.</p></div>';
      }

      if (coin.nft_url) {
        html += '<a href="' + esc(coin.nft_url) + '" target="_blank" class="btn-opensea">View on OpenSea</a>';
      }
      html += '<a href="#" onclick="sharePage(); return false;" class="btn-share">Share this coin</a>';

      box.innerHTML = html;
      document.title = coin.title + " - Ancient Persian Coins";
    } catch (e) {
      console.error(e);
      box.innerHTML = '<div class="error">Could not load coin data. Please try again later.</div>';
    }
  }

  function sharePage() {
    if (navigator.share) {
      navigator.share({ title: document.title, url: window.location.href }).catch(function () {});
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    }
  }

  loadCoin();
</script>
</body>
</html>
